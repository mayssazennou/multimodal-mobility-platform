# =====================================================================
#  Starter kit — Plateforme de mobilité multimodale
#  Démarre les DEUX systèmes partenaires "legacy" (fournis, non modifiables).
#  Les étudiants ajoutent LEURS services (microservices, bridges, BFF…)
#  sur le même réseau "mobilite-net".
#
#  Lancement :  docker compose up --build
#
#  Encadrement : Pr. Mahmoud NASSAR
# =====================================================================
services:

  # --- Opérateur ferroviaire : serveur CORBA (JacORB) ---
  rail:
    build: ./rail-operator-corba
    image: mobilite/rail-operator-corba:1.0.0
    container_name: rail-operator-corba
    environment:
      # Hôte annoncé dans l'IOR. Pour un bridge tournant DANS ce réseau,
      # laisser "rail". Pour un bridge tournant sur l'hôte, mettre "localhost".
      CORBA_ADVERTISED_HOST: rail
      CORBA_PORT: "1050"
      IOR_FILE: /ior/RailBooking.ior
    ports:
      - "1050:1050"          # IIOP, publié sur l'hôte
    volumes:
      - ./ior:/ior           # le fichier IOR apparaît côté hôte dans ./ior/

  # --- Partenaire aérien : service SOAP (Spring WS) ---
  air:
    build: ./air-partner-soap
    image: mobilite/air-partner-soap:1.0.0
    container_name: air-partner-soap
    ports:
      - "8081:8080"     # WSDL: http://localhost:8081/ws/air.wsdl


  air-bridge:
    build: ./air-bridge
    ports:
      - "8085:8085"
    environment:
      AIR_SOAP_URL: http://air:8080/ws
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?copier .env.example vers .env}
      JAVA_TOOL_OPTIONS: "-Xmx192m"
    depends_on:
      - air
      - redis
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Active la persistance AOF et sécurise avec un mot de passe
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?copier .env.example vers .env}
    volumes:
      - redis_data:/data
    
  rail-bridge:
    build: ./rail-bridge
    depends_on:
      - rail
    environment:
      RAIL_IOR_FILE: /ior/RailBooking.ior
      JAVA_OPTS: "-Xmx256m"
    volumes:
      - ./ior:/ior:ro
    ports:
      - "8082:8080"
    mem_limit: 400m

  carshare-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: carshare
      POSTGRES_USER: carshare
      POSTGRES_PASSWORD: ${CARSHARE_DB_PASSWORD:?copier .env.example vers .env}
    volumes:
      - carshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carshare -d carshare"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  carshare-service:
    build:
      context: .
      dockerfile: carshare-service/Dockerfile
    environment:
      JAVA_OPTS: "-Xmx192m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://carshare-db:5432/carshare
      SPRING_DATASOURCE_USERNAME: carshare
      SPRING_DATASOURCE_PASSWORD: ${CARSHARE_DB_PASSWORD:?copier .env.example vers .env}
    depends_on:
      carshare-db:
        condition: service_healthy
    ports:
      - "8086:8080"
    mem_limit: 384m

  saga-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: sagadb
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: ${SAGA_DB_PASSWORD:?copier .env.example vers .env}
    ports:
      - "5433:5432"          # 5433 côté Windows pour éviter un conflit avec un Postgres local
    volumes:
      - saga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U saga -d sagadb" ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  saga-service:
    build: ./saga-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://saga-db:5432/sagadb
      SPRING_DATASOURCE_USERNAME: saga
      SPRING_DATASOURCE_PASSWORD: ${SAGA_DB_PASSWORD:?copier .env.example vers .env}
      SERVER_PORT: 8084
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    depends_on:
      saga-db:
        condition: service_healthy
    mem_limit: 448m

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"      # interface web : http://localhost:16686
    # OTLP reste interne : les services enverront leurs traces vers http://jaeger:4318
    mem_limit: 256m

  booking-db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_DB: bookingdb
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD}
    ports:
      - "5436:5432"          # 5436côté Windows pour éviter un conflit avec un Postgres local
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U booking -d bookingdb" ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9094:9094"          # acces depuis votre machine (IntelliJ)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    mem_limit: 768m
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic booking-events --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic booking-events.DLT --partitions 3 --replication-factor 1


networks:
  default:
    name: mobilite-net

volumes:
  redis_data:
  saga-db-data:
  booking-db-data:
  carshare-pgdata:
