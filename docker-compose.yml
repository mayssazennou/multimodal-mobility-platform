# =====================================================================
#  Starter kit — Plateforme de mobilité multimodale
#  Démarre les DEUX systèmes partenaires "legacy" (fournis, non modifiables).
#  Les étudiants ajoutent LEURS services (microservices, bridges, BFF…)
#  sur le même réseau "mobilite-net".
#
#  Lancement :  docker compose up --build
#
#  Encadrement : Pr. Mahmoud NASSAR
# =====================================================================
services:

  # --- Opérateur ferroviaire : serveur CORBA (JacORB) ---
  rail:
    build: ./rail-operator-corba
    image: mobilite/rail-operator-corba:1.0.0
    container_name: rail-operator-corba
    environment:
      # Hôte annoncé dans l'IOR. Pour un bridge tournant DANS ce réseau,
      # laisser "rail". Pour un bridge tournant sur l'hôte, mettre "localhost".
      CORBA_ADVERTISED_HOST: rail
      CORBA_PORT: "1050"
      IOR_FILE: /ior/RailBooking.ior
    ports:
      - "1050:1050"          # IIOP, publié sur l'hôte
    volumes:
      - ./ior:/ior           # le fichier IOR apparaît côté hôte dans ./ior/

  # --- Partenaire aérien : service SOAP (Spring WS) ---
  air:
    build: ./air-partner-soap
    image: mobilite/air-partner-soap:1.0.0
    container_name: air-partner-soap
    ports:
      - "8081:8080"     # WSDL: http://localhost:8081/ws/air.wsdl


  air-bridge:
    build: ./air-bridge
    container_name: air-bridge
    ports:
      - "8085:8085"
    environment:
      AIR_SOAP_URL: http://air:8080/ws
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - air
      - redis

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "6379:6379"
    # Active la persistance AOF et sécurise avec un mot de passe
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    
  rail-bridge:
    build: ./rail-bridge
    depends_on:
      - rail
    environment:
      RAIL_IOR_FILE: /ior/RailBooking.ior
      JAVA_OPTS: "-Xmx256m"
    volumes:
      - ./ior:/ior:ro
    ports:
      - "8082:8080"
    mem_limit: 400m

  carshare-db:
    image: postgres:16-alpine
    container_name: carshare-db
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_DB: carshare
      POSTGRES_USER: carshare
      POSTGRES_PASSWORD: ${CARSHARE_DB_PASSWORD}
    volumes:
      - carshare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carshare -d carshare"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

  carshare-service:
    build:
      context: .
      dockerfile: carshare-service/Dockerfile
    container_name: carshare-service
    environment:
      JAVA_OPTS: "-Xmx192m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://carshare-db:5432/carshare
      SPRING_DATASOURCE_USERNAME: carshare
      SPRING_DATASOURCE_PASSWORD: ${CARSHARE_DB_PASSWORD}
    depends_on:
      carshare-db:
        condition: service_healthy
    ports:
      - "8086:8080"
    mem_limit: 384m

  saga-db:
    image: postgres:16-alpine
    container_name: saga-db
    environment:
      POSTGRES_DB: sagadb
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: ${SAGA_DB_PASSWORD}
    ports:
      - "5433:5432"          # 5433 côté Windows pour éviter un conflit avec un Postgres local
    volumes:
      - saga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U saga -d sagadb" ]
      interval: 5s
      timeout: 3s
      retries: 10

  saga-service:
    build: ./saga-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://saga-db:5432/sagadb
      SPRING_DATASOURCE_USERNAME: saga
      SPRING_DATASOURCE_PASSWORD: ${SAGA_DB_PASSWORD}
      SERVER_PORT: 8084
    depends_on:
      saga-db:
        condition: service_healthy

networks:
  default:
    name: mobilite-net

volumes:
  redis_data:
  carshare-pgdata:
  saga-db-data:
