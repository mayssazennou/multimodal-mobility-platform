spring.application.name=booking-service
server.port=8087

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/bookingdb}
spring.datasource.username=booking
spring.datasource.password=${BOOKING_DB_PASSWORD:bookingpassword}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# --- Kafka : connexion ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# --- Kafka : consommateur ---
spring.kafka.consumer.group-id=booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=ma.mobility.canonical.BookingEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=ma.mobility.canonical
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# --- Kafka : producteur (utilise uniquement pour ecrire dans la DLT) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- Nom du topic ---
booking.kafka.topic=booking-events