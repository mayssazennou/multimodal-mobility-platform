spring.application.name=saga-service
server.port=8084

# PostgreSQL (lancé depuis ton PC, donc localhost:5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/sagadb
spring.datasource.username=saga
spring.datasource.password=${SAGA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

bridges.rail.url=${RAIL_BRIDGE_URL:http://localhost:8083}
bridges.air.url=${AIR_BRIDGE_URL:http://localhost:8082}
bridges.car.url=${CAR_SERVICE_URL:http://localhost:8084}