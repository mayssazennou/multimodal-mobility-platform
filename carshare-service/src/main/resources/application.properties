spring.application.name=carshare-service
server.port=8086

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/carshare}
spring.datasource.username=carshare
spring.datasource.password=${CARSHARE_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Paramètres métier ---
carshare.hold-ttl-minutes=10
