server.port=8080
spring.application.name=carshare-service

# Base propre au service : base "carshare"  (un PostgreSQL dédié, voir docker-compose.snippet.yml).
# Dans Docker, SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD surchargent ces valeurs.
spring.datasource.url=jdbc:postgresql://localhost:5432/carshare
spring.datasource.username=carshare
spring.datasource.password=${CARSHARE_DB_PASSWORD}
# Petit pool : économise les connexions et la mémoire de la base
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
