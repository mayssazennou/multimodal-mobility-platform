server.port=8080
spring.application.name=rail-bridge
spring.jackson.serialization.write-dates-as-timestamps=false

# Fichier IOR publié par l'opérateur ferroviaire (volume partagé ./ior)
rail.ior-file=${RAIL_IOR_FILE:/ior/RailBooking.ior}
# Délais CORBA en millisecondes
rail.connect-timeout-ms=${RAIL_CONNECT_TIMEOUT_MS:3000}
rail.reply-timeout-ms=${RAIL_REPLY_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health